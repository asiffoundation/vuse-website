# Tạm thời: tải ảnh ứng viên từ Pexels (giấy phép Pexels, dùng miễn phí) để chọn làm ảnh minh hoạ.
name: Tải ảnh ứng viên Pexels
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/fetch-pexels.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tải ảnh
        run: |
          mkdir -p public/images/candidates
          ids="14316313 30481773 9488193 33985331 18395403 35131382 8731906 34022738 29482552 27246756 34152680 6646918 7156178 6995244 25584155 6646921 28157387 29677340 16495497 34663391 8703380 5998445 7446997 5998443 7147642 3811855 6194683 8415672"
          ok=0
          for id in $ids; do
            out=public/images/candidates/px-$id.jpg
            curl -sL --max-time 60 -A "curl/8.5.0" -o "$out" "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=1600&fm=jpg"
            mime=$(file -b --mime-type "$out"); size=$(stat -c %s "$out")
            if [[ "$mime" == image/jpeg && "$size" -gt 20000 ]]; then echo "OK $id $((size/1024))KB"; ok=$((ok+1)); else echo "FAIL $id $mime $size"; rm -f "$out"; fi
          done
          echo "OK: $ok"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/candidates
          git diff --cached --quiet && exit 0
          git commit -m "Tạm: ảnh ứng viên từ Pexels để chọn" && git push
