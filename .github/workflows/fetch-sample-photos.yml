# Tải ảnh minh hoạ mẫu (Unsplash) vào repo. Chạy tay ở tab Actions, hoặc tự chạy khi danh sách ảnh thay đổi.
name: Tải ảnh minh hoạ mẫu
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/sample-photos.txt
      - scripts/fetch-sample-photos.sh
      - .github/workflows/fetch-sample-photos.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q imagemagick >/dev/null
      - run: bash scripts/fetch-sample-photos.sh
      - name: Commit ảnh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/site src/lib/media.ts
          git diff --cached --quiet && { echo "Không có ảnh mới"; exit 0; }
          git commit -m "Thêm ảnh minh hoạ mẫu từ Unsplash vào repo"
          git push
